# Minimal flat sonair classification config — MNIST (10-class digit) edition.
#
#   marainer train -c examples/train_efficientvit_b0_mnist.yaml
#
# Adapted from waivefront-rfuav/config/train_efficientvit_b0_sonair.yaml (the
# 37-class RFUAV drone config) — only the dataset changed to `mnist`.
#
# How it stays this small:
#  * `sonair.LightningClassificationTrainer` bakes loss (CrossEntropy), collate,
#    optimizer (AdamW), and metrics (top1/f1). It also exposes ergonomic knobs
#    (batch_size / num_workers / max_epochs / logger) that build the DataLoaders
#    + the pytorch_lightning.Trainer for you.
#  * Every top-level key below is wired into the trainer by **Confluid
#    broadcasting** (sibling keys are injected into the same-named trainer
#    constructor params) — no nesting or `!ref` plumbing needed.
#  * The model is `!lazy:` so `num_classes` is **derived from the dataset**
#    (10 for MNIST, via `sampleflux.num_classes` walking the targets) and injected
#    by the trainer's `initialize()` at run time — it is NOT specified here.
#
# MNIST is greyscale 28x28; the dataset converts each image to RGB and resizes
# to the model's expected size, so the 3-channel efficientvit backbone works.

trainer: !class:sonair.LightningClassificationTrainer
  experiment_name: mnist_classification
  run_name: efficientvit_b0_mnist

# Model — `!lazy:` so the trainer injects the dataset-derived num_classes (10).
model: !lazy:sonair.TimmModel
  model_name: efficientvit_b0
  pretrained: true

# Data: HuggingFace `mnist`. MNIST exposes `train` and `test` splits (no
# `validation`), so the held-out split is `test`.
train_set: !class:sampleflux.sources.HuggingFaceSource
  path: "mnist"
  split: train

val_set: !class:sampleflux.sources.HuggingFaceSource
  path: "mnist"
  split: test

# Ergonomic knobs — broadcast into the trainer, which assembles the loaders +
# Lightning Trainer from them.
batch_size: 32
num_workers: 8
max_epochs: 3

# `logger` broadcasts into the trainer ctor and is forwarded to the base, which
# bakes it into LazyClass(pytorch_lightning.Trainer, logger=[...]); the base's
# flow(self.lightning) at run() materializes these `!class:` logger Fluids.
logger:
  - !class:pytorch_lightning.loggers.TensorBoardLogger
    save_dir: ./lightning_logs
    name: mnist_efficientvit_b0
