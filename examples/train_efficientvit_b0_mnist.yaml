# One classification config, every training backend — MNIST (10-class digits).
#
#   sonair lightning train examples/train_efficientvit_b0_mnist.yaml
#   recordstream run       examples/train_efficientvit_b0_mnist.yaml   # generic runner, no verb
#
# ---------------------------------------------------------------------------
# The shape of this file IS the demo
# ---------------------------------------------------------------------------
# Everything above the "framework-specific" divider is engine-agnostic: the
# dataset, the batch/epoch knobs, the run identity. Only the keys below it
# change when the training engine does — which is the claim sonair exists to
# demonstrate, made checkable by putting both halves in one file.
#
# The top level is also the DEFAULT backend (lightning), so this config runs
# as-is under `recordstream run` with no scope at all. An alternative backend
# is a `!scope:framework=<name>` block that OVERRIDES only the framework
# specific keys (document order, last write wins). The `sonair <backend>` verb
# activates the matching scope for you; explicitly it is:
#
#   recordstream run examples/train_efficientvit_b0_mnist.yaml --scope framework=keras
#
# or simply, since the verb injects the scope for you:
#
#   sonair keras train examples/train_efficientvit_b0_mnist.yaml
#
# How it stays this small:
#  * `sonair.LightningClassifier` bakes loss (CrossEntropy), collate, optimizer
#    (AdamW) and metrics (top-1 / macro-F1), and turns the ergonomic knobs
#    (batch_size / num_workers / max_epochs / logger) into DataLoaders + a
#    `pytorch_lightning.Trainer`.
#  * Every top-level key is wired in by **Confluid broadcasting** — sibling keys
#    inject into the same-named constructor params, no nesting or `!ref:`.
#  * The model is `!lazy:` so `num_classes` is derived from the dataset (10 for
#    MNIST) and injected by `initialize()` at run time — never written here.
#
# MNIST is greyscale 28x28 and efficientvit_b0 wants 3x224x224 ImageNet-normalized
# input, so the dataset is wrapped in a Stream carrying the `preprocess` op chain
# below. Without it the model receives [N, 28, 28] and rejects it.

# ===========================================================================
# Shared — identical for every backend
# ===========================================================================

experiment_name: mnist_classification
run_name: efficientvit_b0_mnist

# Image preprocessing — named once, referenced by both splits so train and eval
# can never drift apart. Engine-agnostic: it produces a plain CHW float tensor,
# which every backend can consume.
#
#  1. ConvertToImage  28x28 grey -> 224x224x3 uint8 (the backbone's input size;
#     the greyscale plane is broadcast to three channels).
#  2. A.Normalize     ImageNet mean/std — the statistics `pretrained: true` was
#     trained under. A bare albumentations transform drops straight into an ops
#     list; recordstream calls each library the way that library expects.
#  3. ToTensor        HWC -> CHW float32. `normalize: false` because step 2 has
#     ALREADY standardized the pixels; leaving the default true would divide the
#     standardized values by 255 again and squash them to ~[-0.01, 0.01].
preprocess:
  - !class:recordstream.ops.image.ConvertToImage
    width: 224
    height: 224
  - !class:albumentations.Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  - !class:recordstream.ops.torch.ToTensor
    normalize: false

# Data: HuggingFace `mnist`. It exposes `train` and `test` splits (no
# `validation`), so the held-out split is `test`.
train_set: !class:recordstream.Stream
  source: !class:recordstream.sources.HuggingFaceSource()
    path: "mnist"
    split: train
  ops: !ref:preprocess

val_set: !class:recordstream.Stream
  source: !class:recordstream.sources.HuggingFaceSource()
    path: "mnist"
    split: test
  ops: !ref:preprocess

batch_size: 32
num_workers: 8
max_epochs: 3

# ===========================================================================
# Framework-specific — the ONLY part a backend swap touches
# ===========================================================================
# Top level = the default backend (lightning).
#
# No `task:` here on purpose. The classifier's constructor already defaults to
# `fit`, and every `sonair <backend> <verb>` sets the task from the verb
# (train->fit, evaluate->test, predict->predict), so a `task: fit` line would be
# dead in both paths. Set `task:` only to change what a BARE `recordstream run`
# does — e.g. `task: test` in an eval-only config that ships without a verb.

# `!lazy:` so `initialize()` can inject the dataset-derived num_classes (10).
runnable: !class:sonair.LightningClassifier
  model: !lazy:sonair.TimmModel
    model_name: efficientvit_b0
    pretrained: true


# Broadcasts into the classifier's ctor, which bakes it into its own
# `LazyClass(pytorch_lightning.Trainer, logger=[...])`; `_build_trainer()`'s
# `flow(self.lightning)` at run() materializes these `!class:` Fluids.
logger:
  - !class:pytorch_lightning.loggers.TensorBoardLogger
    save_dir: ./lightning_logs
    name: mnist_efficientvit_b0

# ---------------------------------------------------------------------------
# Alternative backends
# ---------------------------------------------------------------------------
# Each is a scope block overriding ONLY the keys above this divider. `keras` is
# LIVE — it is implemented, and `sonair keras train <this file>` runs it. The rest
# stay commented until their runnable classes exist (see docs/frameworks.md); note
# how little a live one has to say, because the data, the knobs and the run identity
# are already shared.
#
keras: !scope:framework=keras
  # Everything above this line is shared verbatim — dataset, splits, batch size, epochs,
  # run identity. What a backend swap actually costs is THIS block.
  runnable: !class:sonair.KerasClassifier
  model: !lazy:sonair.KerasModel
    model_name: MobileNetV3Small
    input_shape: [224, 224, 3]
    pretrained: true
  logger:
    - !class:keras.callbacks.CSVLogger
      filename: ./keras_logs/mnist.csv
  # Two real differences from the torch chain, both about the ENGINE rather than the task:
  #
  #  1. Keras is channels-LAST. The torch chain ends with `ToTensor` to transpose HWC->CHW;
  #     this one simply stops, because `ConvertToImage` already produces HWC.
  #  2. `keras.applications` models carry their OWN preprocessing (`include_preprocessing`
  #     defaults to True and expects raw pixels), so normalizing here would apply it twice.
  #     timm models do not, which is why the torch chain normalizes explicitly.
  preprocess:
    - !class:recordstream.ops.image.ConvertToImage
      width: 224
      height: 224

