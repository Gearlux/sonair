description: "LightningClassificationEvaluator: specialised image-classification evaluator with baked-in classification_collate_fn and accuracy/F1 metrics."
use_case: "Drop-in replacement for LightningEvaluator when evaluating image classifiers. Only requires model, dataset, num_classes — collate and metrics are wired automatically. Invoke via `sonair evaluate` or `marainer classification evaluate`."
category: "Classification"
flux_type: "LightningClassificationEvaluator"
class_path: "sonair.evaluator.LightningClassificationEvaluator"
params:
  model:
    type: "torch.nn.Module"
    required: true
    description: "Classification model. Must be pre-weight-loaded — pass checkpoint_path to the model class."
  dataset:
    type: "Any"
    required: true
    description: "Evaluation dataset or Flux pipeline."
  num_classes:
    type: "int"
    required: true
    description: "Number of output classes. Drives automatic metric construction."
  loader:
    type: "Lazy[DataLoader]"
    default: "Class(DataLoader, collate_fn=classification_collate_fn)"
    description: "DataLoader config. classification_collate_fn is baked in."
  predictions_sink:
    type: "Any | null"
    default: null
    description: "Optional sink with .write(prediction, metadata) and .close(). Use ClassificationPredictionsSink for per-sample JSON."
  lightning:
    type: "Lazy[pytorch_lightning.Trainer]"
    default: "Class(L.Trainer)"
    description: "PyTorch Lightning Trainer config."
  experiment_name:
    type: "str"
    default: "sonair_classification_eval"
    description: "MLflow experiment name."
  run_name:
    type: "str"
    default: "evaluate"
    description: "MLflow run name."
  metrics_sidecar_path:
    type: "str | null"
    default: null
    description: "Optional path. When set, writes a logger-agnostic JSON dump of final metrics after evaluation."
  metrics:
    type: "torchmetrics.MetricCollection | null"
    default: "auto (top-1 accuracy + macro F1, +top-5 when num_classes >= 5, prefix test/)"
    description: "MetricCollection. Auto-built from num_classes; override via YAML if needed."
