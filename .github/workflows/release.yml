# =========================================================================
# HAND-WRITTEN workflow — NOT generated by `aisland jenkins scaffold`.
# (ci.yml / Jenkinsfile are generated; this release pipeline is separate so
# regeneration never clobbers it.)
#
# Publishes the `sonair` distribution to PyPI when a version tag is pushed:
#
#   git tag v0.1.0a1 && git push origin v0.1.0a1
#
# Uses PyPI Trusted Publishing (OIDC, no stored API token). One-time setup on
# https://pypi.org/manage/account/publishing/ — add a "pending publisher":
#   PyPI project name: sonair
#   Owner:             Gearlux
#   Repository:        sonair
#   Workflow name:     release.yml
#   Environment:       pypi
#
# Publish ORDER: loggair -> confluid -> liquifai -> recordstream -> matrainer are all
# on PyPI already, and this package declares floors on all of them, so it publishes
# after them. Nothing else in this repository's dependency chain is unpublished.
# =========================================================================
name: Release to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build & verify distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install packaging toolchain
      run: python -m pip install build twine uv
    - name: Guard - tag matches pyproject version
      run: |
        PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
          echo "::error::Tag v$TAG_VERSION does not match pyproject version $PKG_VERSION"
          exit 1
        fi
    - name: Build sdist + wheel
      run: python -m build
    - name: Check package metadata
      run: python -m twine check --strict dist/*
    - name: Smoke-test the built wheel in a clean venv
      # Runs from /tmp: with the repo root as cwd, `import sonair` would find the
      # SOURCE tree (cwd shadows site-packages) and silently test the repo instead
      # of the wheel. This is the package-shadowing trap the workspace mandates warn
      # about — the repo directory and the package share a name.
      run: |
        python -m venv /tmp/smoke
        /tmp/smoke/bin/pip install --quiet dist/*.whl
        cd /tmp
        /tmp/smoke/bin/python - <<'EOF'
        import os
        import sys
        from importlib.metadata import entry_points, version

        import sonair

        # The core install is BACKEND-FREE: no training framework, no tracker library. Every
        # backend lives behind its extra, so an import that drags one in is a release bug.
        HEAVY = ("torch", "pytorch_lightning", "lightning", "tensorflow", "keras", "jax", "mlx",
                 "timm", "transformers", "mlflow", "wandb")
        heavy = [m for m in HEAVY if m in sys.modules]
        assert not heavy, f"`import sonair` imported {heavy}"

        # Touching a backend that is not installed names the extra to install — the one
        # message a user of the bare install meets first.
        try:
            sonair.LightningClassifier
        except ImportError as exc:
            assert "pip install 'sonair[lightning]'" in str(exc), str(exc)
        else:
            raise AssertionError("sonair.LightningClassifier resolved without the [lightning] extra")

        # The `sonair` command loads on the bare install and still pulls in no framework.
        (script,) = entry_points(group="console_scripts", name="sonair")
        script.load()
        heavy = [m for m in HEAVY if m in sys.modules]
        assert not heavy, f"loading the `sonair` command imported {heavy}"

        # `__version__` is the RELEASED number: read from the wheel's own metadata, which the
        # tag guard above matched to pyproject.toml. Missing or typed-in-and-stale fails here,
        # before anything reaches PyPI.
        tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
        assert sonair.__version__ == version("sonair") == tag, (sonair.__version__, version("sonair"), tag)
        print("wheel smoke-test OK, version:", version("sonair"))
        EOF
    - name: Every extra resolves from PyPI
      # `pip install sonair[<extra>]` is what a user types, and nothing above installs an
      # extra. An extra naming a package that is not on PyPI builds, uploads and
      # smoke-tests cleanly, then fails for every user who asks for it.
      # Resolution only (--dry-run): no framework is downloaded or installed.
      run: |
        WHEEL=$(ls dist/*.whl)
        EXTRAS=$(python -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml','rb'))['project']['optional-dependencies']))")
        for extra in $EXTRAS; do
          echo "::group::sonair[$extra]"
          uv pip install --dry-run --python /tmp/smoke/bin/python "$WHEEL[$extra]"
          echo "::endgroup::"
        done
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
