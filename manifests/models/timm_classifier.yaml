description: "timm-backed image-classification model wrapped for the Marainer Trainer flow."
use_case: "Default classification model for any image task. Forward returns raw logits — pair with ClassificationLoss (CE + label_smoothing + class_weights) and torchmetrics.classification.* metrics. timm replaces the original ImageNet head with a fresh linear layer of num_classes."
category: "Classification"
flux_type: "Model"
task: "image_classification"
class_path: "sonair.timm_classifier.TimmClassifierModel"
params:
  model_name:
    type: "str"
    default: "efficientvit_b0"
    description: "timm model identifier (efficientvit_b0 / resnet50 / vit_base_patch16_224 / convnext_tiny / mobilenetv3_small_100 / etc.). See timm.list_models()."
  num_classes:
    type: "int"
    required: true
    description: "Output class count. timm builds a fresh head of this size."
  pretrained:
    type: "bool"
    default: true
    description: "Load timm-pretrained weights for the backbone (head starts random when num_classes != original)."
  drop_rate:
    type: "float"
    default: 0.0
    description: "Dropout rate applied before the classifier head."
  drop_path_rate:
    type: "float"
    default: 0.0
    description: "Stochastic-depth drop rate (timm-specific)."
  in_chans:
    type: "int"
    default: 3
    description: "Number of input channels (e.g. 1 for grayscale spectrograms)."
  checkpoint_path:
    type: "str | null"
    default: null
    description: "Optional Lightning .ckpt path. Loaded after pretrained backbone."
  checkpoint_strict:
    type: "bool"
    default: false
    description: "Forwarded to load_state_dict(strict=...)."
