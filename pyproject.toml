[project]
name = "sonair"
version = "0.1.0"
description = "Image-classification models and a standard-Lightning classifier (timm-backed)."
authors = [{name = "Taidal"}]
license = {text = "MIT"}
dependencies = [
    # CORE IS BACKEND-FREE (2026-07-30). What stays here is what EVERY backend needs: the
    # config/CLI surface, the record engine, and the task-shaped pieces that are engine-neutral.
    # A training framework — torch, Lightning, timm, Keras — belongs to whichever backend the
    # operator selected, so it lives in that backend's extra. Installing sonair bare gives you
    # the CLI and the config surface; touching a backend without its extra fails with the exact
    # install command (see `sonair/cli.py`).
    #
    #   pip install 'sonair[lightning]'          the reference backend (torch + pl + timm)
    #   pip install 'sonair[keras]'              Keras 3 (runs on torch / tensorflow / jax)
    #   pip install 'sonair[lightning,keras]'    both
    #
    # marainer is core because it is a TRACKING library, not a framework: its own torch and
    # framework helpers sit behind ITS extras, which the backend extras below select.
    "marainer>=0.1.0",
    # 0.3.0 is the floor for the `framework=` discovery tag, passed at decoration
    # time in sonair/classification.py — against 0.2.0 every registration raises
    # TypeError at import.
    "confluid>=0.3.0",
    "recordstream>=0.1.0",
    "loggair>=0.1.0",
    "datasets>=2.0.0",
    "pillow",
    "tqdm",  # progress bar while the trainer walks train targets to fit the label encoder
]
requires-python = ">=3.12"

[project.optional-dependencies]
# Backend extras — one per training framework, selectable singly or together:
#
#   uv pip install -e './sonair[lightning]'
#   uv pip install -e './sonair[keras]'
#   uv pip install -e './sonair[lightning,keras]'
#
# `lightning` and `keras` are IMPLEMENTED; the rest are templates whose verbs name the work.
# An extra exists for each so the not-implemented guidance can print a real install command,
# and so wiring a backend later is a dependency change rather than a packaging one.
lightning = [
    "torch",
    "torchmetrics",
    "pytorch-lightning",
    "timm>=1.0.0",          # the model zoo TimmModel wraps
    # marainer's pl-side tracking helpers + the tracker backends this backend's configs wire.
    "marainer[lightning,mlflow,tensorboard]>=0.1.0",
]
# Keras 3 is an API, not an engine — it needs ONE compute backend underneath (torch/TF/jax), and
# `sonair/_keras.py` selects whichever is installed. So each Keras extra names its OWN engine; a
# `tensorflow = ["sonair[keras]", ...]` chain would have dragged torch into a TensorFlow install,
# which is the opposite of what selecting an extra is for.
keras = [
    "keras>=3.0",
    "torch",                # the engine `sonair[keras]` runs Keras on
    # Tracking for a Keras run. Deliberately marainer[keras], NOT marainer[tensorflow]: the
    # callback needs the Keras API, not the TensorFlow engine.
    "marainer[keras]>=0.1.0",
]
tensorflow = [
    "keras>=3.0",           # Keras 3 IS tf.keras in TF >= 2.16
    "tensorflow>=2.16",     # ...this extra's engine
    "marainer[keras]>=0.1.0",
]
jax = [
    "jax>=0.4",
    "flax>=0.8",            # NNX is the current Flax module API
]
huggingface = [
    "transformers>=4.40",
    "accelerate>=0.30",     # what `Trainer` uses for device/distribution placement
]
mlx = [
    # Apple silicon only — the marker keeps `pip install sonair[mlx]` from
    # failing outright elsewhere, so the template stays installable everywhere.
    "mlx>=0.15; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = [
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
]

[project.scripts]
sonair = "sonair.cli:main"

# Liquifai app registration: lets `liquifai-install-completions` discover this
# CLI via an instant entry-point metadata read instead of executing the binary
# (subprocess probe, 15 s timeout each). Name = the app/binary name; value =
# the LiquifyApp instance. Entry-point changes need an editable reinstall.
[project.entry-points."liquifai.apps"]
sonair = "sonair.cli:app"

[project.entry-points."confluid.configurables"]
# ONE ENTRY POINT PER BACKEND MODULE, deliberately — not a single `sonair = "sonair"` (2026-07-30).
# Importing the package no longer registers anything: every backend name in `sonair/__init__.py`
# is lazy so a Keras-only install never imports torch, which also means the package import has no
# registration side effect. Naming the modules directly restores discovery AND makes it track the
# install: a scanner imports each, and one whose backend is absent simply fails and is skipped
# (navigaitor's bootstrap catches BaseException per module and warns). So a keras-only install
# advertises exactly the Keras classes — which is the correct answer, not a degraded one.
sonair-lightning = "sonair.lightning_classifier"
sonair-timm = "sonair.timm_model"
sonair-keras = "sonair.keras_classifier"
sonair-keras-model = "sonair.keras_model"
# Scan sonair.classification directly so StreamStudio / navigaitor discovery surfaces the registered
# classification losses (torch.nn.*) and metrics (torchmetrics.classification.Multiclass*) — their
# __module__ is torch / torchmetrics, so they're picked up via that module's __all__-gated pass.
sonair-classification = "sonair.classification"

# Which of this project's extras are ML FRAMEWORKS, for `aisland framework`. Selecting a name
# here is what makes `aisland setup` add the matching extra to this project's install.
#
# Only the IMPLEMENTED backends are declared. The `tensorflow` / `jax` / `mlx` / `huggingface`
# extras above exist so the CLI's not-implemented templates can print a real install command;
# declaring them here would install three frameworks nothing can run yet.
[tool.aisland]
frameworks = ["lightning", "keras"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sonair*"]

[tool.setuptools.package-data]
sonair = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sonair"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203"]

[tool.mypy]
disable_error_code = ["import-untyped"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchmetrics.*",
    "pytorch_lightning.*",
    "timm.*",
    "datasets.*",
    "PIL.*",
]
ignore_missing_imports = true
