[project]
name = "sonair"
version = "0.1.0"
description = "Image-classification models and a standard-Lightning classifier (timm-backed)."
authors = [{name = "Taidal"}]
license = {text = "MIT"}
dependencies = [
    # CORE IS BACKEND-FREE (2026-07-30). What stays here is what EVERY backend needs: the
    # config/CLI surface, the record engine, and the task-shaped pieces that are engine-neutral.
    # A training framework — torch, Lightning, timm, Keras — belongs to whichever backend the
    # operator selected, so it lives in that backend's extra. Installing sonair bare gives you
    # the CLI and the config surface; touching a backend without its extra fails with the exact
    # install command (see `sonair/cli.py`).
    #
    #   pip install 'sonair[lightning]'          the reference backend (torch + pl + timm)
    #   pip install 'sonair[keras]'              Keras 3 (runs on torch / tensorflow / jax)
    #   pip install 'sonair[lightning,keras]'    both
    #
    # matrainer is core because it is a TRACKING library, not a framework: its own torch and
    # framework helpers sit behind ITS extras, which the backend extras below select.
    "matrainer>=0.1.0",
    # 0.3.0 is the floor for the `framework=` discovery tag, passed at registration
    # time in sonair/torch_classification.py + sonair/keras_classification.py —
    # against 0.2.0 every registration raises TypeError at import.
    "confluid>=0.3.0",
    # recordstream ships as a pre-release (0.1.0a1). Under PEP 440 a plain `>=0.1.0`
    # EXCLUDES every pre-release of 0.1.0, so it would resolve to nothing.
    "recordstream>=0.1.0a1",
    "loggair>=0.1.0",
    "datasets>=2.0.0",
    "pillow",
    "tqdm",  # progress bar while the trainer walks train targets to fit the label encoder
]
requires-python = ">=3.12"

[project.optional-dependencies]
# Backend extras — one per training framework, selectable singly or together:
#
#   uv pip install -e './sonair[lightning]'
#   uv pip install -e './sonair[keras]'
#   uv pip install -e './sonair[lightning,keras]'
#
# `lightning` and `keras` are IMPLEMENTED; the rest are templates whose verbs name the work.
# An extra exists for each so the not-implemented guidance can print a real install command,
# and so wiring a backend later is a dependency change rather than a packaging one.
lightning = [
    "torch",
    "torchmetrics",
    "pytorch-lightning",
    "timm>=1.0.0",          # the model zoo TimmModel wraps
    # matrainer's pl-side tracking helpers + the tracker backends this backend's configs wire.
    "matrainer[lightning,mlflow,tensorboard]>=0.1.0",
]
# The `lightning` extra MINUS pytorch-lightning — a hand-written training loop and nothing
# under it. `matrainer[torch]` rather than `[lightning]` is the whole point: the metric helpers
# (`build_metric_collection` / `scalar_metrics`) moved to `matrainer.torch` on 2026-08-01 for
# exactly this backend, because importing them from `matrainer.lightning` ran that package's
# `require("pytorch_lightning")` and made a deliberately Lightning-free backend need Lightning.
torch = [
    "torch",
    "torchmetrics",
    "timm>=1.0.0",          # the model zoo `TimmModel` wraps — shared with the lightning backend
    "recordstream[torch]>=0.1.0",
    "matrainer[torch,mlflow,tensorboard]>=0.1.0",
]
# Keras 3 is an API, not an engine — it needs ONE compute backend underneath (torch/TF/jax), and
# `recordstream.keras` (which `sonair/_keras.py` imports through) selects whichever is installed.
# So each Keras extra names its OWN engine; a `tensorflow = ["sonair[keras]", ...]` chain would
# have dragged torch into a TensorFlow install, which is the opposite of what selecting an extra
# is for.
keras = [
    "keras>=3.0",
    "torch",                # the engine `sonair[keras]` runs Keras on
    # The PyDataset batching adapter (`recordstream.keras.RecordSequence`) + the KERAS_BACKEND
    # ordering this backend's keras imports depend on.
    "recordstream[keras]>=0.1.0",
    # Tracking for a Keras run. Deliberately matrainer[keras], NOT matrainer[tensorflow]: the
    # callback needs the Keras API, not the TensorFlow engine.
    "matrainer[keras]>=0.1.0",
]
tensorflow = [
    "keras>=3.0",           # Keras 3 IS tf.keras in TF >= 2.16
    "tensorflow>=2.16",     # ...this extra's engine
    "recordstream[keras]>=0.1.0",
    "matrainer[keras]>=0.1.0",
]
# fastai is a LAYER ON TORCH, not an engine of its own — its losses are `nn.Module`s and its
# `Learner` consumes plain `torch.utils.data.DataLoader`s. So this extra names torch's stack
# (which is also why `TimmModel` is the model wrapper a fastai config wires, unchanged from the
# lightning backend) plus fastai itself. No `pytorch-lightning`: the two trainers are
# alternatives, and a fastai-only install should not carry a Trainer it never builds.
fastai = [
    "fastai>=2.7",
    # TWO UPPER BOUNDS, both for upstream breaks measured on 2026-07-30 with fastai 2.8.7 —
    # not preferences, and each removable the moment upstream ships a fix:
    #
    #  * fastcore 2.x dropped `L.starmap`, which fastai's own `Optimizer.set_hypers` still
    #    calls, so `Learner.fit_one_cycle` dies at the first `create_opt()` with
    #    `AttributeError: 'list' object has no attribute 'starmap'`. fastai declares only
    #    `fastcore>=1.8.0`, so a fresh resolve picks 2.1.x and every fastai run fails.
    #  * fastprogress >= 1.1 added a `python-fasthtml` dependency (a progress bar pulling in a
    #    web framework), which drags `starlette` past what other workspace packages pin — and
    #    fastprogress 1.1.x ALSO requires fastcore 2.x, so it cannot coexist with the bound
    #    above (it fails at import: `mtime_policy() got an unexpected keyword argument 'arg'`).
    #    fastprogress 1.0.5 has no dependencies at all, which is what a progress bar should have.
    "fastcore<2",
    "fastprogress<1.1",
    "torch",
    "timm>=1.0.0",          # the model zoo `TimmModel` wraps — shared with the lightning backend
    "recordstream[torch]>=0.1.0",
    # matrainer.torch carries the Lightning-checkpoint loader `TimmModel` reads; the tracker
    # backends a fastai config wires are the same ones every other backend uses.
    "matrainer[torch,mlflow,tensorboard]>=0.1.0",
]
jax = [
    "jax>=0.4",
    "flax>=0.8",            # NNX is the current Flax module API
    "optax>=0.2",           # the optimizers and losses; JAX itself ships neither
]
huggingface = [
    "transformers>=4.40",
    "accelerate>=0.30",     # what `Trainer` uses for device/distribution placement
]
mlx = [
    # Apple silicon only — the marker keeps `pip install sonair[mlx]` from
    # failing outright elsewhere, so the template stays installable everywhere.
    "mlx>=0.15; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = [
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
]

[project.scripts]
sonair = "sonair.cli:main"

# Liquifai app registration: lets `liquifai-install-completions` discover this
# CLI via an instant entry-point metadata read instead of executing the binary
# (subprocess probe, 15 s timeout each). Name = the app/binary name; value =
# the LiquifyApp instance. Entry-point changes need an editable reinstall.
[project.entry-points."liquifai.apps"]
sonair = "sonair.cli:app"

[project.entry-points."confluid.configurables"]
# ONE ENTRY POINT PER BACKEND MODULE, deliberately — not a single `sonair = "sonair"` (2026-07-30).
# Importing the package no longer registers anything: every backend name in `sonair/__init__.py`
# is lazy so a Keras-only install never imports torch, which also means the package import has no
# registration side effect. Naming the modules directly restores discovery AND makes it track the
# install: a scanner imports each, and one whose backend is absent simply fails and is skipped
# (navigaitor's bootstrap catches BaseException per module and warns). So a keras-only install
# advertises exactly the Keras classes — which is the correct answer, not a degraded one.
#
# THE RULE, pinned by tests/test_entry_points.py (2026-08-01): every module that registers a
# configurable — an `@configurable` class or a `configurable(...)` / `register(...)` call — is
# named here. The test derives that set from the source tree, so a new backend cannot forget.
# It was added because five backends HAD forgotten: the huggingface / jax / mlx / tensorflow-model
# work (2026-07-31) shipped eight registering modules with no entry point, which cost them
# nothing at run time (a dotted path in YAML imports the module itself, and the CLI imports its
# own backend) and made them invisible to every discovery surface — navigaitor's slot pickers,
# the form-specs, the StreamStudio palette.
sonair-lightning = "sonair.lightning_classifier"
# The bare-torch runnable. It shares `sonair.torch_classification` (declared below) with
# the lightning backend rather than bringing a set of its own — a `torch.nn` loss does not
# care which loop calls it.
sonair-torch = "sonair.torch_classifier"
sonair-timm = "sonair.timm_model"
# The shared conv spec in torch.nn — serves EVERY torch backend (lightning, torch, fastai),
# which is also why it has no per-backend twins: they differ in the training loop, not in what
# a model is, exactly as they already share `TimmModel`.
sonair-torch-convnet = "sonair.convnet.torch_convnet"
sonair-keras = "sonair.keras_classifier"
sonair-keras-model = "sonair.keras_model"
# The shared conv spec in keras.layers — in the `sonair.convnet` package because it wraps
# NOTHING, unlike the zoo wrapper above; its own entry point for the same reason the others have
# one. The package `__init__` imports nothing, so this reaches the module directly.
sonair-keras-convnet = "sonair.convnet.keras_convnet"
# The TensorFlow runnable plus BOTH kinds of TF-native model: a SavedModel loader (a genuinely
# different zoo from `keras.applications`) and the shared conv spec in raw `tf.nn` ops. fastai
# brings no model module of its own — it IS torch, so `FastaiClassifier` takes `TimmModel`; a
# backend that adds no new wiring surface adds no new module (docs/architecture.md §5).
sonair-tensorflow = "sonair.tensorflow_classifier"
sonair-tensorflow-model = "sonair.tensorflow_model"
sonair-tensorflow-convnet = "sonair.convnet.tensorflow_convnet"
sonair-fastai = "sonair.fastai_classifier"
# The huggingface runnable + its Hub wrapper. No loss module by design: an
# `AutoModelForImageClassification` computes its own loss from `config.problem_type`, so there is
# nothing a config could wire.
sonair-huggingface = "sonair.huggingface_classifier"
sonair-huggingface-model = "sonair.huggingface_model"
# The jax and mlx runnables plus their conv-spec models. Neither has a zoo to wrap (transformers
# v5 dropped Flax; `mlx-image` hard-pins a huggingface_hub this workspace cannot take), so their
# only model IS the shared spec — hence a `*-convnet` entry and no `*-model` one. Neither
# registers losses either: optax ships functions and factories, `mlx.optimizers` ships classes,
# so those are resolved by NAME and there is nothing for the registry to tag.
sonair-jax = "sonair.jax_classifier"
sonair-flax-convnet = "sonair.convnet.flax_convnet"
sonair-mlx = "sonair.mlx_classifier"
sonair-mlx-convnet = "sonair.convnet.mlx_convnet"
# The loss/metric registrations, ONE MODULE PER ENGINE — a loss is engine-bound, so each set is
# tagged `framework="torch"` / `framework="keras"` and lives where a missing backend can drop it
# whole. Scanned directly because the registered classes' __module__ is torch / torchmetrics /
# keras, which `scan_module` filters out; each module's __all__-gated pass is what surfaces them.
sonair-torch-classification = "sonair.torch_classification"
sonair-keras-classification = "sonair.keras_classification"
# fastai's OWN losses (the `*Flat` family) — registered `framework="torch"`, because that is
# what they are: `nn.Module`s a Lightning run can consume just as well. There is deliberately no
# `sonair-tensorflow-classification`: TF >= 2.16 exposes Keras 3 as `tf.keras`, so the
# TensorFlow backend's loss/metric set IS the Keras one, already registered above.
sonair-fastai-classification = "sonair.fastai_classification"

# Which of this project's extras are ML FRAMEWORKS, for `aisland framework`. Selecting a name
# here is what makes `aisland setup` add the matching extra to this project's install.
#
# Only the IMPLEMENTED backends are declared. The `jax` / `mlx` / `huggingface` extras above
# exist so the CLI's not-implemented templates can print a real install command; declaring them
# here would install three frameworks nothing can run yet.
#
# Declaring a name here only puts it on the MENU — what gets installed is the separate
# selection in the workspace `config.toml` (`aisland framework set …`), so listing a name costs
# nothing until someone selects it.
#
# NO protobuf conflict, contrary to what this comment claimed until 2026-07-30. A clean
# resolve of `tensorflow + wandb + mlflow + tensorboard + opentelemetry-proto + grpcio-status`
# lands on ONE protobuf (6.33.6, measured) that all of them accept. The "TF forces protobuf
# 3.20.3 -> 7.35.1 and breaks the tracking stack" observation came from `uv pip install
# tensorflow` into an already-STALE venv: uv moves the minimum it must, so protobuf jumped
# while wandb (0.25.0, `<7`), grpcio-status (1.80.0, `<7`) and opentelemetry-proto (1.27.0,
# `<5`) stayed put. All three relaxed to `<8` in releases that are already out. Let them move
# too — or recreate the venv — and TensorFlow resolves like any other extra.
[tool.aisland]
frameworks = ["lightning", "torch", "keras", "tensorflow", "fastai", "huggingface", "jax", "mlx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sonair*"]

[tool.setuptools.package-data]
sonair = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sonair"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203"]

[tool.mypy]
disable_error_code = ["import-untyped"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchmetrics.*",
    "pytorch_lightning.*",
    "timm.*",
    "datasets.*",
    "PIL.*",
]
ignore_missing_imports = true
