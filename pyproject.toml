[project]
name = "sonair"
version = "0.1.0"
description = "Image-classification models and adapters for the Marainer training framework."
authors = [{name = "Taidal"}]
license = {text = "MIT"}
dependencies = [
    # marainer provides OPTIONAL experiment tracking (git/config/system-metrics/log-file) + a couple
    # of torch utilities (ensure_sample_dataset / load_lightning_checkpoint). The [lightning] extra
    # pulls the pl-side tracking helpers; [mlflow]/[tensorboard] add those tracker backends. sonair's
    # LightningClassifier is a standard pl.LightningModule and trains without marainer (a couple of
    # tracking lines would drop out).
    "marainer[lightning,mlflow,tensorboard]>=0.2.0",
    "confluid>=0.1.0",
    "sampleflux>=0.1.0",
    "loggair>=0.1.0",
    "torch",
    "torchmetrics",
    "pytorch-lightning",
    "timm>=1.0.0",
    "datasets>=2.0.0",
    "pillow",
    "tqdm",  # progress bar while the trainer walks train targets to fit the label encoder
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
]

[project.scripts]
sonair = "sonair.cli:main"

# Liquifai app registration: lets `liquifai-install-completions` discover this
# CLI via an instant entry-point metadata read instead of executing the binary
# (subprocess probe, 15 s timeout each). Name = the app/binary name; value =
# the LiquifyApp instance. Entry-point changes need an editable reinstall.
[project.entry-points."liquifai.apps"]
sonair = "sonair.cli:app"

[project.entry-points."confluid.configurables"]
sonair = "sonair"
# Scan sonair.classification directly so FluxStudio / navigaitor discovery surfaces the registered
# classification losses (torch.nn.*) and metrics (torchmetrics.classification.Multiclass*) — their
# __module__ is torch / torchmetrics, so they're picked up via that module's __all__-gated pass.
sonair-classification = "sonair.classification"

[tool.setuptools.packages.find]
where = ["."]
include = ["sonair*"]

[tool.setuptools.package-data]
sonair = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sonair"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203"]

[tool.mypy]
disable_error_code = ["import-untyped"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchmetrics.*",
    "pytorch_lightning.*",
    "timm.*",
    "datasets.*",
    "PIL.*",
]
ignore_missing_imports = true
