# One classification config, every training backend — MNIST (10-class digits).
#
#   sonair lightning train examples/train_efficientvit_b0_mnist.yaml
#   recordstream run       examples/train_efficientvit_b0_mnist.yaml   # generic runner, no verb
#
# ---------------------------------------------------------------------------
# The shape of this file IS the demo
# ---------------------------------------------------------------------------
# Everything above the "framework-specific" divider is engine-agnostic: the
# dataset, the batch/epoch knobs, the run identity. Only the keys below it
# change when the training engine does — which is the claim sonair exists to
# demonstrate, made checkable by putting both halves in one file.
#
# The top level is also the DEFAULT backend (lightning), so this config runs
# as-is under `recordstream run` with no scope at all. An alternative backend
# is a `!scope:framework=<name>` block that OVERRIDES only the framework
# specific keys (document order, last write wins). The `sonair <backend>` verb
# activates the matching scope for you; explicitly it is:
#
#   recordstream run examples/train_efficientvit_b0_mnist.yaml --scope framework=keras
#
# or simply, since the verb injects the scope for you:
#
#   sonair keras train examples/train_efficientvit_b0_mnist.yaml
#
# How it stays this small:
#  * `sonair.LightningClassifier` bakes loss (CrossEntropy), collate, optimizer
#    (AdamW) and metrics (top-1 / macro-F1), and turns the ergonomic knobs
#    (batch_size / num_workers / max_epochs / logger) into DataLoaders + a
#    `pytorch_lightning.Trainer`.
#  * Every top-level key is wired in by **Confluid broadcasting** — sibling keys
#    inject into the same-named constructor params, no nesting or `!ref:`.
#  * The model is `!lazy:` so `num_classes` is derived from the dataset (10 for
#    MNIST) and injected by `initialize()` at run time — never written here.
#
# MNIST is greyscale 28x28 and efficientvit_b0 wants 3x224x224 ImageNet-normalized
# input, so the dataset is wrapped in a Stream carrying the `preprocess` op chain
# below. Without it the model receives [N, 28, 28] and rejects it.

# ===========================================================================
# Shared — identical for every backend
# ===========================================================================

experiment_name: mnist_classification
run_name: efficientvit_b0_mnist

# Image preprocessing — named once, referenced by both splits so train and eval
# can never drift apart. Engine-agnostic: it produces a plain CHW float tensor,
# which every backend can consume.
#
#  1. ConvertToImage  28x28 grey -> 224x224x3 uint8 (the backbone's input size;
#     the greyscale plane is broadcast to three channels).
#  2. A.Normalize     ImageNet mean/std — the statistics `pretrained: true` was
#     trained under. A bare albumentations transform drops straight into an ops
#     list; recordstream calls each library the way that library expects.
#  3. ToTensor        HWC -> CHW float32. `normalize: false` because step 2 has
#     ALREADY standardized the pixels; leaving the default true would divide the
#     standardized values by 255 again and squash them to ~[-0.01, 0.01].
preprocess:
  - !class:recordstream.ops.image.ConvertToImage
    width: 224
    height: 224
  - !class:albumentations.Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  - !class:recordstream.ops.torch.ToTensor
    normalize: false

# Data: HuggingFace `mnist`. It exposes `train` and `test` splits (no
# `validation`), so the held-out split is `test`.
train_set: !class:recordstream.Stream
  source: !class:recordstream.sources.huggingface.HuggingFaceSource()
    path: "mnist"
    split: train
  ops: !ref:preprocess

val_set: !class:recordstream.Stream
  source: !class:recordstream.sources.huggingface.HuggingFaceSource()
    path: "mnist"
    split: test
  ops: !ref:preprocess

batch_size: 32
num_workers: 8
max_epochs: 3

# ===========================================================================
# Framework-specific — the ONLY part a backend swap touches
# ===========================================================================
# Top level = the default backend (lightning).
#
# No `task:` here on purpose. The classifier's constructor already defaults to
# `fit`, and every `sonair <backend> <verb>` sets the task from the verb
# (train->fit, evaluate->test, predict->predict), so a `task: fit` line would be
# dead in both paths. Set `task:` only to change what a BARE `recordstream run`
# does — e.g. `task: test` in an eval-only config that ships without a verb.

# THE MODEL SLOT TAKES TWO THINGS HERE — one active, one alternative. They differ
# in what they WRAP, not in how they are wired, which is the whole point:
#
#   TimmModel     any of timm's ~1000 pretrained backbones. Best accuracy, and what
#                 you want for real work.
#   TorchConvNet  the shared conv spec (sonair/convnet/spec.py) in torch.nn, wrapping
#                 nothing. NO pretrained weights, so it scores far lower — it exists
#                 so the SAME architecture can be run under torch, Keras, TensorFlow,
#                 JAX and MLX and the comparison is between frameworks rather than
#                 between five different networks.
#
# `!lazy:` so `initialize()` can inject the dataset-derived num_classes (10).
runnable: !class:sonair.LightningClassifier
  model: !lazy:sonair.TimmModel
    model_name: efficientvit_b0
    pretrained: true
  # model: !lazy:sonair.TorchConvNet
  #   input_shape: [224, 224, 3]     # (H, W, C) in every implementation — the KNOB is
  #                                  # channels-last even though torch's TENSOR is NCHW,
  #                                  # so this one line is identical in all five blocks.
  convnet: !scope:model=convnet
    model: !lazy:sonair.convnet.torch_convnet.TorchConvNet


# Broadcasts into the classifier's ctor, which bakes it into its own
# `LazyClass(pytorch_lightning.Trainer, logger=[...])`; `_build_trainer()`'s
# `flow(self.lightning)` at run() materializes these `!class:` Fluids.
logger:
  - !class:pytorch_lightning.loggers.TensorBoardLogger
    save_dir: ./lightning_logs
    name: mnist_efficientvit_b0

# ---------------------------------------------------------------------------
# Alternative backends
# ---------------------------------------------------------------------------
# Each is a scope block overriding ONLY the keys above this divider. `keras` is
# LIVE — it is implemented, and `sonair keras train <this file>` runs it. `tensorflow`
# and `fastai` are implemented too but stay COMMENTED, for a different reason than
# `jax`: their runnable classes exist, their extras are simply not part of the
# workspace's selected frameworks, so a live block would break `tests/test_examples_load.py`
# on a default checkout (loading the config imports every `!class:` it names). Select
# them — `aisland framework set lightning keras tensorflow fastai`, or
# `pip install 'sonair[tensorflow,fastai]'` — and uncomment the block you want. Note how
# little a live one has to say, because the data, the knobs and the run identity are
# already shared.
#
# PyTorch with NO training framework at all — the control experiment. This is the
# smallest block in the file and that is its entire point: `sonair torch train` swaps
# `pytorch_lightning.Trainer` for a hand-written loop and NOTHING else changes. Same
# `TimmModel`, same `preprocess` chain, same `torch.nn` loss set, same metrics, same
# artifacts. The one key it must drop is `logger:` — those are `pytorch_lightning`
# loggers and there is no Trainer to hand them to; tracking goes through `trackers:`,
# which every backend has.
#
#   sonair torch train examples/train_efficientvit_b0_mnist.yaml
#
torch: !scope:framework=torch
  runnable: !class:sonair.TorchClassifier
  # Bare-torch-only knobs: where to run, where the state_dict lands, optional clipping.
  #   device: auto            # auto | cpu | cuda | mps
  #   checkpoint_dir: ./torch_runs/mnist
  #   grad_clip: 1.0
  logger: null

keras: !scope:framework=keras
  # Everything above this line is shared verbatim — dataset, splits, batch size, epochs,
  # run identity. What a backend swap actually costs is THIS block.
  runnable: !class:sonair.KerasClassifier
  model: !lazy:sonair.KerasModel
    model_name: MobileNetV3Small
    input_shape: [224, 224, 3]
    pretrained: true
  logger:
    - !class:keras.callbacks.CSVLogger
      filename: ./keras_logs/mnist.csv
  # Loss and metrics are left unset on purpose: both backends resolve them from the DATA in
  # `initialize()` (int64 ids here -> SparseCategoricalCrossentropy + accuracy), so "not
  # chosen" stays distinguishable from "chosen". To say it yourself, pick from the registered
  # `keras.losses` / `keras.metrics` set (sonair/keras_classification.py) — and note that the
  # head is a bare Dense, i.e. RAW LOGITS, which every crossentropy loss must be told:
  #
  #   loss: !class:keras.losses.SparseCategoricalCrossentropy
  #     from_logits: true            # without it Keras normalizes by the row SUM: finite, wrong
  #   metrics:
  #     - !class:keras.metrics.SparseCategoricalAccuracy      # argmax-based: logit-safe as-is
  #     - !class:keras.metrics.SparseTopKCategoricalAccuracy { k: 5 }
  #     - !class:SparseCategoricalCrossentropy@role=metric,framework=keras()
  #
  # That last line is the `@role=` selector: seven Keras names are BOTH a loss and a metric
  # (BinaryCrossentropy / Hinge / KLDivergence / …), so a bare reference to one is ambiguous
  # and confluid says so instead of guessing. A dotted path works too and never needs the
  # selector: !class:keras.src.metrics.probabilistic_metrics.SparseCategoricalCrossentropy()
  #
  # Pick by TARGET SHAPE first: MNIST targets are single-label, so `_to_arrays` hands the
  # metric int64 ids [N] and only the `Sparse*` metrics read that. The element-wise ones
  # (Precision / Recall / BinaryAccuracy / the TP-TN-FP-FN counters) need the float multi-hot
  # [N, C] a `recordstream.MultiLabel` target produces — wired here they die on the first
  # batch with "The size of tensor a (32) must match the size of tensor b (320)".
  #
  # Two real differences from the torch chain, both about the ENGINE rather than the task:
  #
  #  1. Keras is channels-LAST. The torch chain ends with `ToTensor` to transpose HWC->CHW;
  #     this one simply stops, because `ConvertToImage` already produces HWC.
  #  2. `keras.applications` models carry their OWN preprocessing (`include_preprocessing`
  #     defaults to True and expects raw pixels), so normalizing here would apply it twice.
  #     timm models do not, which is why the torch chain normalizes explicitly.
  preprocess:
    - !class:recordstream.ops.image.ConvertToImage
      width: 224
      height: 224

# TensorFlow — a native `tf.data` + `tf.GradientTape` loop. Note what it does NOT
# override: the model is the SAME `KerasModel`, because `tf.keras` IS Keras 3 in
# TensorFlow >= 2.16, and so are the losses and metrics. What it adds is `export_dir`
# (a SavedModel, the artifact that is TensorFlow's and not Keras's) and `jit_compile`
# (XLA on the traced train step). `preprocess` is the Keras chain, for the engine
# reasons spelled out in that block: channels-last, and no explicit normalization.
#
#   sonair tensorflow train examples/train_efficientvit_b0_mnist.yaml
#
# tensorflow: !scope:framework=tensorflow
#   runnable: !class:sonair.TensorFlowClassifier
#     export_dir: ./exported/mnist_mobilenetv3
#     jit_compile: false
#   # THE MODEL SLOT TAKES FOUR THINGS HERE — one active, three alternatives. They differ
#   # in what they wrap, not in how they are wired, which is the point:
#   #
#   #   KerasModel         a keras.applications zoo backbone, pretrained. Best accuracy;
#   #                      `tf.keras` IS Keras 3, so this is TF-native despite the name.
#   #   TensorFlowConvNet  the shared conv spec in raw tf.nn ops (sonair/convnet/spec.py).
#   #                      No pretrained weights — it exists so the same architecture can be
#   #                      compared against its Flax, MLX and Keras twins.
#   #   KerasConvNet       the same spec in keras.layers — runs on any Keras engine.
#   #   TensorFlowModel    a SavedModel you already have (Kaggle Models, or one this
#   #                      project exported). Set `num_classes`: a SavedModel is an opaque
#   #                      graph that does not declare its head width.
#   model: !lazy:sonair.KerasModel
#     model_name: MobileNetV3Small
#     input_shape: [224, 224, 3]
#     pretrained: true
#   # model: !lazy:sonair.TensorFlowConvNet
#   #   input_shape: [224, 224, 3]
#   # model: !lazy:sonair.KerasConvNet
#   #   input_shape: [224, 224, 3]
#   # model: !lazy:sonair.TensorFlowModel
#   #   saved_model: ./exported/mnist_mobilenetv3
#   #   num_classes: 10
#   logger:
#     - !class:keras.callbacks.CSVLogger
#       filename: ./tensorflow_logs/mnist.csv
#   preprocess:
#     - !class:recordstream.ops.image.ConvertToImage
#       width: 224
#       height: 224

# fastai — a `Learner` with one-cycle scheduling. This is the SMALLEST block of the
# four, because fastai runs on torch: the model, the preprocessing chain and the batch
# shape are the top level's verbatim, and only the loop changes. `metrics` are NAMES,
# not `!class:` tags — fastai's classification metrics are plain functions, so there
# is no class for a tag to resolve (see sonair/fastai_classification.py).
#
#   sonair fastai train examples/train_efficientvit_b0_mnist.yaml
#
# fastai: !scope:framework=fastai
#   runnable: !class:sonair.FastaiClassifier
#     learning_rate: 0.001
#     one_cycle: true
#     metrics: [accuracy, top_k_accuracy]
#     # No `model:` override — fastai IS torch, so it inherits the top-level slot
#     # unchanged, whether that is `TimmModel` or `TorchConvNet`. There is no
#     # `FastaiConvNet` for the same reason there is no `fastai_model.py`: a backend
#     # that adds no new wiring surface adds no new module.
#   logger:
#     - !class:fastai.callback.progress.CSVLogger
#       fname: fastai_logs/mnist.csv

# huggingface — `transformers.Trainer` fine-tuning a Hub checkpoint. The block is bigger
# than fastai's for one honest reason: this backend swaps the MODEL as well as the loop, so
# it needs its own `model:` and a `preprocess` sized to that checkpoint. What it does NOT
# need is a `loss` — an `AutoModelForImageClassification` computes its own from
# `config.problem_type`, which is why this backend registers no loss set at all.
#
#   sonair huggingface train examples/train_efficientvit_b0_mnist.yaml
#
# huggingface: !scope:framework=huggingface
#   runnable: !class:sonair.HuggingFaceClassifier
#     learning_rate: 0.00005      # transformers' fine-tuning default — two orders below
#                                 # a from-scratch LR, because we start from real weights
#     metrics: [accuracy]
#   model: !lazy:sonair.HuggingFaceModel
#     model_name: google/vit-base-patch16-224
#     pretrained: true

# jax — a jitted optax loop over a Flax model. The `model:` block is the interesting part:
# there is NO Flax zoo to wrap (transformers dropped Flax in v5, flaxmodels last released in
# 2023), so `FlaxConvNet` implements sonair's own shared conv spec — the SAME architecture that
# `KerasConvNet`, `TensorFlowConvNet` and `MlxConvNet` implement, so a cross-framework
# comparison compares frameworks rather than four different networks. It has no pretrained
# weights, which is why the accuracy here is far below the zoo-backed backends above.
#
# Losses and optimizers are NAMES, not `!class:` tags — optax ships functions and factories,
# so there is no class for a tag to resolve (see sonair/jax_classifier.py).
#
#   sonair jax train examples/train_efficientvit_b0_mnist.yaml
#
# jax: !scope:framework=jax
#   runnable: !class:sonair.JaxClassifier
#     learning_rate: 0.001
#     optimizer: adam
#     metrics: [accuracy]
#   model: !lazy:sonair.FlaxConvNet
#     input_shape: [224, 224, 3]     # channels LAST, like the keras block
#   preprocess:                      # ...and so the chain STOPS before a CHW ToTensor
#     - !class:recordstream.ops.image.ConvertToImage
#       width: 224
#       height: 224

# mlx — Apple-silicon unified memory. The block is the jax one with two words changed, which
# is the point: same architecture (`sonair/convnet/spec.py`, its fourth implementation), same
# channels-last preprocessing, same knobs. What differs is underneath — no host/device copy,
# and lazy arrays the loop has to `mx.eval`.
#
# `sonair[mlx]` is empty off Apple silicon (the extra carries a platform marker), so this
# block simply cannot run on a Linux CI box. Losses and optimizers are NAMES: `mlx.nn.losses`
# ships functions and `mlx.optimizers` ships classes, so neither is a `!class:` tag.
#
#   sonair mlx train examples/train_efficientvit_b0_mnist.yaml
#
# mlx: !scope:framework=mlx
#   runnable: !class:sonair.MlxClassifier
#     learning_rate: 0.001
#     optimizer: Adam                # a CLASS name here, unlike jax's optax factory
#     metrics: [accuracy]
#   model: !lazy:sonair.MlxConvNet
#     input_shape: [224, 224, 3]
#   preprocess:
#     - !class:recordstream.ops.image.ConvertToImage
#       width: 224
#       height: 224
