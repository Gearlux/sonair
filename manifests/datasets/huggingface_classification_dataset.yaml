description: "HuggingFace imagefolder → DataFlux Sample wrapper for classification."
use_case: "Drop-in classification dataset adapter. Wraps any HF imagefolder dataset (kitofrank/RFUAV, food101, imagenet-1k, etc.) into the DataFlux Sample triplet so it composes cleanly with sonair's collate / loss / metrics."
category: "Classification"
flux_type: "Dataset"
task: "image_classification"
class_path: "sonair.hf_dataset.HuggingFaceClassificationDataset"
params:
  path:
    type: "str"
    required: true
    description: "HF dataset path or local imagefolder path."
  split:
    type: "str"
    default: "train"
    description: "HF split name."
  image_size:
    type: "int"
    default: 224
    description: "Resize target — matches the backbone's expected input resolution."
  metadata_features:
    type: "List[str] | null"
    default: null
    description: "Optional HF feature columns preserved on Sample.metadata."
