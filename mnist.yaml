workspace:
  _target_: annotaide.workspace.Workspace
  sources:
  - _target_: annotaide.records.StreamRecordings
    source:
      _target_: recordstream.sources.huggingface.HuggingFaceSource
      path: mnist
      split: train
      input_feature: image
      target_feature: label
      metadata_features: '*'
    image_key: image
    targets:
    - _target_: annotaide.records.ClassTarget
      key: class
      layer: human
    count: 0
    name: ''
    layers_from_fields: true
  plugins: []
  ranker:
    _target_: annotaide.ranking.LabelDisagreement
    reference: human
    compare: ''
    min_score: 0.0
  openers:
  - _target_: annotaide.openers.PipelineOpener
    targets:
    - _target_: annotaide.records.ClassTarget
      key: class
      layer: human
    layers_from_fields: true
    image_key: image
  - _target_: annotaide.openers.DecisionLogOpener
  - _target_: annotaide.openers.QueueFileOpener
  - _target_: annotaide.openers.CheckpointOpener
  recipes:
    dataset:
      _target_: annotaide.recipes.DatasetRecipe
      source_class: ''
      targets:
      - _target_: annotaide.records.ClassTarget
        key: class
        layer: human
      image_key: image
      fields:
      - path
      - split
      - count
      - name
      - revision
      prefill:
        split: test
        count: 1000
      name: dataset
    model:
      _target_: annotaide.recipes.ModelRecipe
      name: classifier
      task: classification
      model_class: ''
      model_classes:
      - sonair.TimmModel
      model_params:
        model_name: efficientvit_b0
        num_classes: 10
        pretrained: false
      ops:
      - _target_: recordstream.ops.image.ConvertToImage
        colormap: gray
        width: 224
        height: 224
        max_size: 512
        flip_vertical: false
        field: ''
        output: image
      - _target_: albumentations.augmentations.pixel.transforms.Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
      - _target_: recordstream.ops.torch.ToTensor
        normalize: false
        field: ''
        output: ''
      input_key: image
      device: cpu
    labels:
      _target_: annotaide.recipes.RankerRecipe
      name: labels
      ranker:
        _target_: annotaide.ranking.LabelDisagreement
        reference: human
        compare: ''
        min_score: 0.0
    iou:
      _target_: annotaide.recipes.RankerRecipe
      name: iou
      ranker:
        _target_: annotaide.ranking.IoUDisagreement
        reference: human
        compare: ''
        iou: 0.5
        min_score: 0.0
    new-log:
      _target_: annotaide.recipes.LogRecipe
  layout:
    split: cols
    sizes:
    - 0.2
    - 0.55
    - 0.25
    cells:
    - tabs:
